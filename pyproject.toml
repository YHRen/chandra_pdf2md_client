[project]
name = "chandra-mcp-server"
version = "0.2.0"
description = "Chandra PDF-to-Markdown client and MCP server for academic papers, with recovery of vector figures the vision model skips"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "filetype>=1.2.0",
    "markdownify>=1.2.2",
    "openai>=1.106.1",
    "pillow>=11.3.0",
    "pypdfium2>=5.0.0",
    "six>=1.17.0",
    "mcp>=1.25.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
chandra-mcp = "chandra_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chandra_mcp"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0"]
